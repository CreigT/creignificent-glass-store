<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You · CREIGNIFICENT LLC</title>
  <style>
    :root { --bg: #0f0c29; --bg2: #302b63; --glass: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.18); --text: #f8fafc; --muted: #cbd5e1; --accent: #818cf8; }
    body { font-family: system-ui, sans-serif; background: linear-gradient(135deg, var(--bg), var(--bg2)); color: var(--text); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 2.5rem; text-align: center; max-width: 480px; }
    h1 { margin-bottom: 1rem; }
    p { color: var(--muted); margin-bottom: 1.5rem; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Payment received</h1>
    <p>Thank you. Check your email for access links and next steps. CREIGNIFICENT LLC will follow up if anything is needed.</p>
    <a href="index.html">Return to store</a>
  </div>
</body>
</html>
